name: Collect NTRIP Data

# 每 6 小时跑一轮：CRTK（crtk.net）+ RTK2GO（rtk2go.com）+ 2rtk.net 自建 Caster
#                   + IGS 站点坐标 + GNSS 卫星 TLE
# 采集结果直接提交到本仓库 data/，Cloudflare Pages 检测到提交后自动重建发布，
# 前端只读同域 ./data/*.json，所以整个站不需要任何后端 API。

on:
  schedule:
    # 每 6 小时一次（UTC；cron 用 UTC，北京时间 = UTC+8）
    # 00/06/12/18 UTC = 北京 08/14/20/02 点
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-ntrip
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # rtk2go / crtk / 2rtk.net 三路公开源都写在 ci.ini 里（源表匿名可读）
      # 若将来 2rtk.net 关闭匿名源表，配 NTRIP_2RTK_* secrets 即可覆盖成带账号的配置
      - name: Prepare config
        env:
          HOST: ${{ secrets.NTRIP_2RTK_HOST }}
          PORT: ${{ secrets.NTRIP_2RTK_PORT }}
          USER: ${{ secrets.NTRIP_2RTK_USERNAME }}
          PASS: ${{ secrets.NTRIP_2RTK_PASSWORD }}
        run: |
          cp ntrip_servers.ci.ini ntrip_servers.ini
          if [ -n "$HOST" ] && [ -n "$USER" ]; then
            echo "检测到 NTRIP_2RTK_* secrets，用账号覆盖 ci.ini 的 [2rtk] 段"
            python scripts/patch_2rtk_cfg.py "$HOST" "${PORT:-2101}" "$USER" "$PASS"
            echo "已注入 2rtk.net 账号（$HOST:${PORT:-2101}）"
          else
            echo "未配置 NTRIP_2RTK_* secrets，直接使用 ci.ini 里的匿名 [2rtk] 配置"
          fi

      # 1) 三路 NTRIP 源表 + IGS 站点坐标（失败的那一路保留上次文件，不清空）
      - name: Collect NTRIP sources
        env:
          NTRIP_CONFIG: ntrip_servers.ini
        run: python lary.py

      # 2) GNSS 卫星 TLE（带本地缓存，1 小时内不重复拉，避免被 CelesTrak 限流）
      #    失败不中断整条流水线，保留上一次的 data/tle-gnss.txt
      - name: Collect GNSS TLE
        continue-on-error: true
        run: python scripts/fetch_tle.py

      - name: Refresh files.json
        run: python scripts/build.py --files-json

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: auto update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Summary
        if: always()
        run: python scripts/summarize.py --github
