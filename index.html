    function detectLang() {
      var q = new URLSearchParams(window.location.search).get('lang');
      if (q === 'zh' || q === 'en') return q;
      var saved = null;
      try { saved = localStorage.getItem('2rtk-lang'); } catch (e) { /* 隐私模式忽略 */ }
      if (saved === 'zh' || saved === 'en') return saved;
      var navLang = (navigator.language || 'en').toLowerCase();
      return navLang.indexOf('zh') === 0 ? 'zh' : 'en';
    }

    var LANG = detectLang();

    function t(key) {
      var dict = I18N[LANG] || I18N.en;
      return Object.prototype.hasOwnProperty.call(dict, key) ? dict[key] : (I18N.en[key] || key);
    }

    /* ==========================================================
     * 2. 多图源（全部为 WGS84 / Web Mercator，保证 RTK 坐标不偏移）
     *    高德、腾讯等 GCJ-02 图源会引入数百米偏移，绝不采用
     * ========================================================== */
    var BASEMAPS = [
      {
        id: 'ion',
        label: { zh: 'Ion / Bing 影像', en: 'Ion / Bing' },
        needKey: function () { return !HAS_ION; },
        probe: function () {

            + '&LAYER=img&tileMatrixSet=w&TileMatrix=2&TileRow=1&TileCol=2&style=default&format=tiles&tk='
            + encodeURIComponent(TIANDITU_KEY));

            url: 'https://t{s}.tianditu.gov.cn/img_w/wmts?service=wmts&request=GetTile&version=1.0.0'
              + '&LAYER=img&tileMatrixSet=w&TileMatrix={TileMatrix}&TileRow={TileRow}&TileCol={TileCol}'
              + '&style=default&format=tiles&tk=' + encodeURIComponent(TIANDITU_KEY),
            layer: 'img',
            style: 'default',
            format: 'image/jpeg',
            tileMatrixSetID: 'w',
            subdomains: ['0', '1', '2', '3', '4', '5', '6', '7'],

          }));

      {
        id: 'osm',
        label: { zh: 'OpenStreetMap', en: 'OpenStreetMap' },

        },
        create: function () {

            url: 'https://tile.openstreetmap.org/'
          }));

      {
        id: 'carto-dark',
        label: { zh: '深色地图', en: 'Dark' },

        },

          return new Cesium.ImageryLayer(new Cesium.UrlTemplateImageryProvider({
            url: 'https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
            maximumLevel: 19,
            credit: new Cesium.Credit('&copy; OpenStreetMap contributors &copy; CARTO', true)
          }));
        }
      }
    ];

    var PROBE_TIMEOUT = 5000;
    var probeState = {};   // id -> 'ok' | 'fail' | 'skip' | 'pending'

    function probeImage(url) {
      return new Promise(function (resolve) {
        var settled = false;
        var img = new Image();
        var timer = setTimeout(function () {
          if (settled) return;
          settled = true;
          img.src = '';
          resolve(false);
        }, PROBE_TIMEOUT);

        img.onload = function () {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(img.naturalWidth > 0);
        };
        img.onerror = function () {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(false);
        };
        img.src = url;
      });
    }

    function probeFetch(url) {
      if (!window.fetch) return Promise.resolve(false);
      var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var timer = controller ? setTimeout(function () { controller.abort(); }, PROBE_TIMEOUT) : null;
      return fetch(url, controller ? { signal: controller.signal } : {})
        .then(function (r) {
          if (timer) clearTimeout(timer);
          return r.ok;
        })
        .catch(function () {
          if (timer) clearTimeout(timer);
          return false;
        });
    }

    /* ==========================================================
     * 3. 状态变量
     * ========================================================== */
    var tleTimestamp = new Date();
    var rotationEnabled = true;
    var satelliteLabelsVisible = false;
    var stationLabelsVisible = false;
    var coverageVisible = true;
    var lastMeta = null;
    var basemapLayer = null;
    var activeBasemapId = null;
    var basemapBusy = false;

    /* ==========================================================
     * 4. 创建 Viewer
     *    官方推荐写法：baseLayerPicker:false + baseLayer
     *    这里先用 baseLayer:false 立即可渲染，底图异步探测后再挂载
     * ========================================================== */
    var viewer = new Cesium.Viewer('cesiumContainer', {
      timeline: false,
      animation: false,
      shouldAnimate: true,
      baseLayerPicker: false,          // 必须为 false，才能使用 baseLayer
      baseLayer: false,                // 底图稍后探测后动态添加
      geocoder: false,                 // 地理编码依赖 Ion，关闭
      homeButton: false,
      sceneModePicker: true,
      navigationHelpButton: false,
      selectionIndicator: true,
      infoBox: true,
      terrainProvider: new Cesium.EllipsoidTerrainProvider()
    });

    // 关闭 Cesium 自带版权区默认显示位置冲突（保留版权合规展示）
    viewer.cesiumWidget.creditContainer.style.display = 'none';

    // 单独的版权容器，保证 Esri/CARTO/天地图的署名可见（合规要求）
    var creditDiv = document.createElement('div');
    creditDiv.id = 'creditBox';
    creditDiv.style.cssText = 'position:absolute;bottom:32px;right:8px;z-index:997;'
      + 'font-size:10px;color:rgba(255,255,255,0.55);text-align:right;pointer-events:none;max-width:48vw;';
    document.body.appendChild(creditDiv);
    var creditDisplay = new Cesium.CreditDisplay(creditDiv);
    viewer.scene.creditDisplay = creditDisplay;

    /* ==========================================================
     * 5. 底图管理
     * ========================================================== */
    var basemapButton = document.getElementById('basemapButton');
    var basemapPanel = document.getElementById('basemapPanel');

    function basemapLabel(src) {
      return src.label[LANG] || src.label.en;
    }

    function setBasemapButtonText(text) {
      basemapButton.textContent = text;
    }

    function refreshBasemapButtonText() {
      if (basemapBusy) {
        setBasemapButtonText(t('basemapProbing'));
        return;
      }
      if (!activeBasemapId) {
        setBasemapButtonText(t('basemapNone'));
        return;
      }
      var src = BASEMAPS.filter(function (b) { return b.id === activeBasemapId; })[0];
      setBasemapButtonText(t('basemap') + ' · ' + (src ? basemapLabel(src) : '—'));
    }

    function removeBasemap() {
      if (basemapLayer) {
        try { viewer.imageryLayers.remove(basemapLayer, true); } catch (e) { /* ignore */ }
        basemapLayer = null;
      }
      activeBasemapId = null;
    }

    function applyBasemap(src) {
      removeBasemap();
      if (!src) {
        refreshBasemapButtonText();
        renderBasemapPanel();
        return;
      }
      try {
        var layer = src.create();
        if (layer && typeof layer.then === 'function') {
          layer.then(function (l) {
            basemapLayer = viewer.imageryLayers.add(l);
            activeBasemapId = src.id;
            refreshBasemapButtonText();
            renderBasemapPanel();
          }).catch(function (err) {
            console.warn('[2RTK] 底图挂载失败:', src.id, err);
            probeState[src.id] = 'fail';
            refreshBasemapButtonText();
            renderBasemapPanel();
          });
          return;
        }
        basemapLayer = viewer.imageryLayers.add(layer);
        activeBasemapId = src.id;
      } catch (err) {
        console.warn('[2RTK] 底图创建异常:', src.id, err);
        probeState[src.id] = 'fail';
      }
      refreshBasemapButtonText();
      renderBasemapPanel();
    }

    function renderBasemapPanel() {
      basemapPanel.innerHTML = '';

      var title = document.createElement('div');
      title.className = 'basemap-title';
      title.textContent = t('basemapPanelTitle');
      basemapPanel.appendChild(title);

      BASEMAPS.forEach(function (src) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'basemap-item' + (src.id === activeBasemapId ? ' is-active' : '');
        btn.setAttribute('role', 'menuitem');

        var nameSpan = document.createElement('span');
        nameSpan.textContent = basemapLabel(src);
        btn.appendChild(nameSpan);

        var state = probeState[src.id];
        if (src.needKey()) {
          state = 'skip';
        }
        var stSpan = document.createElement('span');
        stSpan.className = 'st';
        if (state === 'ok') { stSpan.className += ' ok'; stSpan.textContent = t('statusOk'); }
        else if (state === 'fail') { stSpan.className += ' fail'; stSpan.textContent = t('statusFail'); }
        else if (state === 'skip') { stSpan.textContent = t('statusSkip'); }
        else { stSpan.textContent = t('statusUnknown'); }
        btn.appendChild(stSpan);

        btn.addEventListener('click', function () {
          closeBasemapPanel();
          if (src.needKey()) return;
          if (src.id === activeBasemapId) return;
          applyBasemap(src);
        });

        basemapPanel.appendChild(btn);
      });
    }

    function openBasemapPanel() {
      renderBasemapPanel();
      basemapPanel.hidden = false;
      basemapButton.setAttribute('aria-expanded', 'true');
    }

    function closeBasemapPanel() {
      basemapPanel.hidden = true;
      basemapButton.setAttribute('aria-expanded', 'false');
    }

    basemapButton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (basemapPanel.hidden) openBasemapPanel();
      else closeBasemapPanel();
    });

    document.addEventListener('click', function (e) {
      if (!basemapPanel.hidden && !basemapPanel.contains(e.target) && e.target !== basemapButton) {
        closeBasemapPanel();
      }
    });

    /**
     * 按优先级串行探测，第一个可达的源直接启用。
     * 这样在不同国家 / 不同网络环境下都能自动落到一个可用的图源。
     */
    async function selectInitialBasemap() {
      basemapBusy = true;
      refreshBasemapButtonText();

      var candidates = BASEMAPS.filter(function (b) { return !b.manualOnly; });

      for (var i = 0; i < candidates.length; i++) {
        var src = candidates[i];
        if (src.needKey()) {
          probeState[src.id] = 'skip';
          continue;
        }
        probeState[src.id] = 'pending';
        renderBasemapPanel();

        var ok = false;
        try {
          ok = await src.probe();
        } catch (e) {
          ok = false;
        }
        probeState[src.id] = ok ? 'ok' : 'fail';
        console.log('[2RTK] 图源探测 ' + src.id + ' -> ' + (ok ? '可用' : '不可达'));

        if (ok) {
          basemapBusy = false;
          applyBasemap(src);
          return;
        }
      }

      basemapBusy = false;
      activeBasemapId = null;
      refreshBasemapButtonText();
      renderBasemapPanel();
      console.warn('[2RTK] 所有底图源均不可达，仅显示站点与卫星（坐标仍然准确）');
    }

    /* ==========================================================
     * 6. 卫星分类配置
     * ========================================================== */
    var countrySatellites = {
      'China': {
        color: Cesium.Color.RED,
        match: function (name) { return /(BEIDOU|IGSO-\d+|M\d+[A-Z]*$|G\d+[A-Z]*$|IGSO-\d+S?|COMPASS)/i.test(name); }
      },
      'Russia': {
        color: Cesium.Color.SKYBLUE,
        match: function (name) { return /(COSMOS(?:[-\s]\d+)|LUCH(?:[-\s]\d+)?|GLONASS|PARUS)/i.test(name); }
      },
      'India': {
        color: Cesium.Color.ORANGE,
        match: function (name) { return /(IRNSS-\d+|NVS-\d+|GSAT-\d+)/i.test(name); }
      },
      'Japan': {
        color: Cesium.Color.WHITE,
        match: function (name) { return /(QZS-\d+|MICHIBIKI)/i.test(name); }
      },
      'EU': {
        color: Cesium.Color.YELLOW,
        match: function (name) { return /(GALILEO|SES-\d+|ASTRA|EUTELSAT)/i.test(name); }
      },
      'USA': {
        color: Cesium.Color.DARKBLUE,
        match: function (name) { return /(GPS|NAVSTAR|BIIR-\d+|BIIRM-\d+|BIIF-\d+|BIII-\d+)/i.test(name); }
      },
      'UK': {
        color: Cesium.Color.MAGENTA,
        match: function (name) { return /(INMARSAT|GALAXY)/i.test(name); }
      }
    };

    var satelliteIcons = {
      'China': './images/cn.png',
      'Russia': './images/ru.png',
      'India': './images/in.png',
      'Japan': './images/jp.png',
      'EU': './images/eu.png',
      'USA': './images/us.png',
      'UK': './images/uk.png',
      'Other': './images/2rtk.png'
    };

    /* ==========================================================
     * 7. 通用工具
     * ========================================================== */
    function isValidCoordinate(lon, lat, height) {
      if (typeof lon !== 'number' || typeof lat !== 'number' || isNaN(lon) || isNaN(lat)) return false;
      if (lon < -180 || lon > 180) return false;
      if (lat < -90 || lat > 90) return false;
      if (height !== undefined && height !== null) {
        if (typeof height !== 'number' || isNaN(height)) return false;
        if (height < -12000 || height > 42000000) return false;
      }
      return true;
    }

    function setActiveButton(activeId) {
      document.querySelectorAll('.data-source-buttons button').forEach(function (btn) {
        btn.classList.toggle('active', btn.id === activeId);
      });
    }

    function getSatelliteCountry(name) {
      var keys = Object.keys(countrySatellites);
      for (var i = 0; i < keys.length; i++) {
        var data = countrySatellites[keys[i]];
        if (data.match && data.match(name)) return keys[i];
      }
      return 'Other';
    }

    /* ==========================================================
     * 8. 控制按钮
     * ========================================================== */
    function refreshControlLabels() {
      document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
      document.title = t('pageTitle');
      document.getElementById('brandSub').textContent = t('brandSub');
      document.getElementById('footerNote').textContent = t('footer');
      document.getElementById('langSwitch').textContent = t('switchLang');

      document.getElementById('toggleButton').textContent = rotationEnabled ? t('pauseRotation') : t('resumeRotation');
      document.getElementById('toggleSatelliteLabels').textContent = satelliteLabelsVisible ? t('hideSatLabels') : t('showSatLabels');
      document.getElementById('toggleStationLabels').textContent = stationLabelsVisible ? t('hideStationLabels') : t('showStationLabels');
      document.getElementById('toggleCoverage').textContent = coverageVisible ? t('hideCoverage') : t('showCoverage');
      refreshBasemapButtonText();

      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        el.textContent = t(el.getAttribute('data-i18n'));
      });

      renderBasemapPanel();
      renderUpdateInfo();
    }

    document.getElementById('langSwitch').addEventListener('click', function () {
      LANG = (LANG === 'zh') ? 'en' : 'zh';
      try { localStorage.setItem('2rtk-lang', LANG); } catch (e) { /* 忽略 */ }
      refreshControlLabels();
    });

    document.getElementById('toggleButton').addEventListener('click', function () {
      rotationEnabled = !rotationEnabled;
      refreshControlLabels();
    });

    document.getElementById('toggleSatelliteLabels').addEventListener('click', function () {
      satelliteLabelsVisible = !satelliteLabelsVisible;
      viewer.entities.values.forEach(function (entity) {
        if (entity.isSatellite && entity.label) entity.label.show = satelliteLabelsVisible;
      });
      refreshControlLabels();
    });

    document.getElementById('toggleStationLabels').addEventListener('click', function () {
      stationLabelsVisible = !stationLabelsVisible;
      viewer.entities.values.forEach(function (entity) {
        if (entity.stationType && entity.label) entity.label.show = stationLabelsVisible;
      });
      refreshControlLabels();
    });

    document.getElementById('toggleCoverage').addEventListener('click', function () {
      coverageVisible = !coverageVisible;
      viewer.entities.values.forEach(function (entity) {
        if (entity.ellipse && entity.stationType && entity.parentId) entity.show = coverageVisible;
      });
      refreshControlLabels();
    });

    /* ==========================================================
     * 9. GNSS 卫星
     * ========================================================== */
    fetch('https://celestrak.org/NORAD/elements/gp.php?GROUP=gnss&FORMAT=tle')
      .then(function (res) { return res.text(); })
      .then(function (tleText) {
        var lines = tleText.trim().split('\n');
        for (var i = 0; i < lines.length; i += 3) {
          var name = lines[i].trim();
          var tle1 = lines[i + 1] ? lines[i + 1].trim() : null;
          var tle2 = lines[i + 2] ? lines[i + 2].trim() : null;
          if (!name || !tle1 || !tle2) continue;

          try {
            var satrec = satellite.twoline2satrec(tle1, tle2);
            var jsDate = new Date();
            var posVel = satellite.propagate(satrec, jsDate);
            var gmst = satellite.gstime(jsDate);

            if (!posVel.position) continue;

            var geo = satellite.eciToGeodetic(posVel.position, gmst);
            var lon = Cesium.Math.toDegrees(geo.longitude);
            var lat = Cesium.Math.toDegrees(geo.latitude);
            var alt = geo.height * 1000;

            if (!isValidCoordinate(lon, lat, alt)) continue;

            var country = getSatelliteCountry(name);
            var icon = satelliteIcons[country] || satelliteIcons['Other'];
            var color = (countrySatellites[country] && countrySatellites[country].color) || Cesium.Color.GRAY;

            var entity = viewer.entities.add({
              id: 'sat_' + name,
              name: name,
              position: Cesium.Cartesian3.fromDegrees(lon, lat, alt),
              billboard: {
                image: icon,
                width: 28,
                height: 28,
                verticalOrigin: Cesium.VerticalOrigin.CENTER,
                scaleByDistance: new Cesium.NearFarScalar(500000, 1.2, 40000000, 0.35)
              },
              label: {
                text: name,
                font: '12px sans-serif',
                fillColor: color,
                style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                outlineWidth: 2,
                verticalOrigin: Cesium.VerticalOrigin.TOP,
                pixelOffset: new Cesium.Cartesian2(0, 20),
                show: satelliteLabelsVisible
              },
              properties: {
                norad: satrec.satnum,
                tleDate: tleTimestamp.toISOString(),
                country: country
              }
            });
            entity.isSatellite = true;
            entity.satrec = satrec;
          } catch (e) {
            console.warn('[2RTK] 卫星 ' + name + ' 处理失败:', e && e.message);
          }
        }
      })
      .catch(function (err) {
        console.warn('[2RTK] 卫星 TLE 数据获取失败:', err && err.message);
      });

    /* ==========================================================
     * 10. 基准站点
     * ========================================================== */
    function removeAllStations() {
      var toRemove = viewer.entities.values.filter(function (e) { return e.stationType; });
      toRemove.forEach(function (e) { viewer.entities.remove(e); });
    }

    function buildStationDescription(station, stationType) {
      var rows = [];
      function row(label, value) {
        rows.push('<tr><td><b>' + label + '</b></td><td>' + (value === undefined || value === null || value === '' ? 'N/A' : value) + '</td></tr>');
      }

      if (['isRtk', 'isRtk2go', 'isCrtk', 'isCustom', 'isWorld'].indexOf(stationType) !== -1) {
        var rtcm = Array.isArray(station.rtcm_types)
          ? (station.rtcm_types.filter(Boolean).join(', ') || 'N/A')
          : 'N/A';
        row(t('tableName'), station.name);
        row(t('tableFormat'), station.format);
        row(t('tableRtcm'), rtcm);
        row(t('tableSystems'), station.systems);
        row(t('tableCountry'), station.country);
        row(t('tableLat'), station.latitude);
        row(t('tableLon'), station.longitude);
        row(t('tableHeight'), station.height);
        row(t('tableNetwork'), station.network);
        row(t('tableNtripVer'), station.ntrip_version);
        row(t('tableHost'), station.server_host);
        row(t('tablePort'), station.server_port);
        row(t('tableAddress'), station.registration_address);
      } else if (stationType === 'isIgs') {
        row(t('tableId'), station.id);
        row(t('tableReceiver'), station.receiver);
        row(t('tableAntenna'), station.antenna);
        row(t('tableLat'), station.latitude);
        row(t('tableLon'), station.longitude);
        row(t('tableHeight'), station.height);
        row(t('tableSystems'), station.systems);
        row(t('tableInstallDate'), station.receiverInstallDate);
      }

      return '<table>' + rows.join('') + '</table>';
    }

    function addRtkEntities(baseStations, color, stationType) {
      baseStations.forEach(function (station) {
        if (!station.name || station.longitude === undefined || station.latitude === undefined) return;

        var lon = parseFloat(station.longitude);
        var lat = parseFloat(station.latitude);
        var height = station.height !== undefined ? parseFloat(station.height) : 0;
        if (isNaN(height)) height = 0;

        if (!isValidCoordinate(lon, lat, height)) return;

        var description = buildStationDescription(station, stationType);

        viewer.entities.add({
          id: stationType + '_' + station.name,
          position: Cesium.Cartesian3.fromDegrees(lon, lat, height),
          point: { pixelSize: 5, color: color },
          label: {
            text: station.name,
            font: '10px sans-serif',
            fillColor: color,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            outlineWidth: 2,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -12),
            show: stationLabelsVisible
          },
          description: description,
          stationType: stationType
        });

        if (stationType !== 'isIgs') {
          [10000, 20000, 50000].forEach(function (radius, i) {
            var colors = [Cesium.Color.GREEN, Cesium.Color.BLUE, Cesium.Color.ORANGE];
            viewer.entities.add({
              id: stationType + '_' + station.name + '_circle_' + i,
              position: Cesium.Cartesian3.fromDegrees(lon, lat),
              ellipse: {
                semiMinorAxis: radius,
                semiMajorAxis: radius,
                height: 0,
                material: colors[i].withAlpha(0.1),
                outline: true,
                outlineColor: colors[i]
              },
              description: description,
              stationType: stationType,
              parentId: stationType + '_' + station.name,
              show: coverageVisible
            });
          });
        }
      });

      viewer.zoomTo(viewer.entities);
    }

    /* ==========================================================
     * 11. 点击拾取
     * ========================================================== */
    var handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    handler.setInputAction(function (movement) {
      var picked = viewer.scene.pick(movement.position);
      if (!Cesium.defined(picked) || !picked.id) return;

      if (picked.id.isSatellite) {
        var entity = picked.id;
        var now = new Date();
        var posVel = satellite.propagate(entity.satrec, now);
        var gmst = satellite.gstime(now);
        if (!posVel.position) return;

        var geo = satellite.eciToGeodetic(posVel.position, gmst);
        var tleAgeDays = ((now - new Date(entity.properties.tleDate)) / 86400000).toFixed(1);

        var rows = [
          [t('satName'), entity.name],
          [t('satNorad'), entity.properties.norad],
          [t('tableCountry'), entity.properties.country],
          [t('satAlt'), geo.height.toFixed(1) + ' km'],
          [t('satPlane'), Cesium.Math.toDegrees(entity.satrec.nodeo).toFixed(2) + '°'],
          [t('satIncl'), Cesium.Math.toDegrees(entity.satrec.inclo).toFixed(2) + '°'],
          [t('satTleAge'), tleAgeDays + ' ' + t('days')]
        ].map(function (r) {
          return '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td></tr>';
        }).join('');

        entity.description = '<table>' + rows + '</table>';
        viewer.selectedEntity = entity;
      } else if (picked.id.stationType) {
        viewer.selectedEntity = picked.id;
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    /* ==========================================================
     * 12. 数据源按钮
     * ========================================================== */
    function showInfoError(title, hint) {
      var el = document.getElementById('updateInfo');
      el.innerHTML = '<div class="fail">' + title + '</div>'
        + (hint ? '<div class="sub">' + hint + '</div>' : '');
    }

    document.getElementById('loadRtkButton').addEventListener('click', function () {
      setActiveButton('loadRtkButton');
      removeAllStations();
      fetch('./data/2rtk.json')
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (data) { addRtkEntities(data, Cesium.Color.CYAN, 'isRtk'); })
        .catch(function (err) {
          console.warn('[2RTK] 2RTK 数据加载失败:', err && err.message);
          showInfoError(t('rtkNotReady'), t('rtkNotReadyHint'));
        });
    });

    document.getElementById('loadRtk2goButton').addEventListener('click', function () {
      setActiveButton('loadRtk2goButton');
      removeAllStations();
      fetch('./data/rtk2go.json')
        .then(function (res) { return res.json(); })
        .then(function (data) { addRtkEntities(data, Cesium.Color.ORANGE, 'isRtk2go'); })
        .catch(function (err) { console.warn('[2RTK] RTK2 数据加载失败:', err && err.message); });
    });

    document.getElementById('loadIgsButton').addEventListener('click', function () {
      setActiveButton('loadIgsButton');
      removeAllStations();
      fetch('./data/IGSNetwork.json')
        .then(function (res) { return res.json(); })
        .then(function (data) {
          var stations = Object.keys(data).map(function (id) {
            return {
              id: id,
              name: id,
              longitude: parseFloat(data[id].Longitude),
              latitude: parseFloat(data[id].Latitude),
              height: parseFloat(data[id].Height || 0),
              systems: (data[id].Receiver && data[id].Receiver.SatelliteSystem) || 'N/A',
              receiver: (data[id].Receiver && data[id].Receiver.Name) || 'N/A',
              receiverInstallDate: (data[id].Receiver && data[id].Receiver.DateInstalled) || 'N/A',
              antenna: (data[id].Antenna && data[id].Antenna.Name) || 'N/A'
            };
          });
          addRtkEntities(stations, Cesium.Color.LIME, 'isIgs');
        })
        .catch(function (err) { console.warn('[2RTK] IGS 数据加载失败:', err && err.message); });
    });

    document.getElementById('loadCrtkButton').addEventListener('click', function () {
      setActiveButton('loadCrtkButton');
      removeAllStations();
      fetch('./data/France.json')
        .then(function (res) { return res.json(); })
        .then(function (data) { addRtkEntities(data, Cesium.Color.MAGENTA, 'isCrtk'); })
        .catch(function (err) { console.warn('[2RTK] CRTK 数据加载失败:', err && err.message); });
    });

    /* ==========================================================
     * 13. World 汇总按钮
     * ========================================================== */
    var excludeFiles = ['2rtk.json', 'France.json', 'rtk2go.json', 'IGSNetwork.json', 'files.json', 'meta.json'];
    var allCustomDataSources = [];

    async function loadCustomDataSources() {
      var container = document.querySelector('.data-source-buttons');
      var worldButton = document.createElement('button');
      worldButton.id = 'loadWorldButton';
      worldButton.type = 'button';
      worldButton.textContent = 'World';
      worldButton.className = 'custom-data-btn';
      container.appendChild(worldButton);

      worldButton.addEventListener('click', async function () {
        setActiveButton('loadWorldButton');
        removeAllStations();

        try {
          if (allCustomDataSources.length === 0) {
            var res = await fetch('./data/files.json');
            if (!res.ok) throw new Error('files.json HTTP ' + res.status);

            var allFiles = await res.json();
            var customFiles = allFiles.filter(function (file) {
              return file.indexOf('.json') !== -1 && excludeFiles.indexOf(file) === -1;
            });

            var results = await Promise.all(customFiles.map(async function (file) {
              try {
                var r = await fetch('./data/' + file);
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return await r.json();
              } catch (e) {
                console.warn('[2RTK] 加载 ' + file + ' 失败:', e && e.message);
                return [];
              }
            }));

            allCustomDataSources = results.reduce(function (acc, arr) {
              return acc.concat(Array.isArray(arr) ? arr : []);
            }, []);
          }

          addRtkEntities(allCustomDataSources, Cesium.Color.YELLOW, 'isWorld');
        } catch (err) {
          console.warn('[2RTK] World 数据加载失败:', err && err.message);
        }
      });
    }

    /* ==========================================================
     * 14. 自动旋转
     * ========================================================== */
    viewer.clock.onTick.addEventListener(function () {
      if (rotationEnabled) {
        viewer.scene.camera.rotate(Cesium.Cartesian3.UNIT_Z, -Cesium.Math.toRadians(0.02));
      }
    });

    /* ==========================================================
     * 15. 数据更新时间
     * ========================================================== */
    function renderUpdateInfo() {
      var el = document.getElementById('updateInfo');
      if (!el) return;

      if (!lastMeta) {
        el.textContent = t('loading');
        return;
      }

      var sources = Array.isArray(lastMeta.sources) ? lastMeta.sources : [];
      var okCount = sources.filter(function (s) { return s && s.ok; }).length;
      var total = sources.length;
      var timeStr = lastMeta.last_update
        ? String(lastMeta.last_update).replace('T', ' ').slice(0, 16)
        : t('timeUnknown');

      el.innerHTML = ''
        + '<div>' + t('updatedAt') + '：' + timeStr + '</div>'
        + '<div><span class="ok">' + t('ok') + ' ' + okCount + '</span> / '
        + '<span class="' + (okCount < total ? 'fail' : 'ok') + '">' + t('fail') + ' ' + (total - okCount) + '</span> '
        + t('sourceCount') + '</div>'
        + '<div class="sub">' + t('autoUpdate') + '</div>';
    }

    function loadMetaInfo() {
      fetch('./data/meta.json')
        .then(function (res) {
          if (!res.ok) throw new Error('meta.json HTTP ' + res.status);
          return res.json();
        })
        .then(function (meta) {
          lastMeta = meta;
          renderUpdateInfo();
        })
        .catch(function () {
          lastMeta = null;
          var el = document.getElementById('updateInfo');
          if (el) el.innerHTML = '<div>' + t('timeUnknown') + '</div>';
        });
    }

    /* ==========================================================
     * 16. 启动
     * ========================================================== */
    refreshControlLabels();
    selectInitialBasemap();
    loadCustomDataSources();
    loadMetaInfo();

    // 默认展示 rtk2go（数据量最大、覆盖最广）
    document.getElementById('loadRtk2goButton').click();
  })();
  </script>
</body>
</html>
