    var PROBE_TIMEOUT = 5000;

    function probeImage(url) {
      return new Promise(function (resolve) {
        var settled = false;
        var img = new Image();
        var timer = setTimeout(function () {
          if (settled) return;
          settled = true;
          img.src = '';
          resolve(false);
        }, PROBE_TIMEOUT);

        img.onload = function () {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(img.naturalWidth > 0);
        };
        img.onerror = function () {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(false);
        };
        img.src = url;
      });
    }

    function probeFetch(url) {
      if (!window.fetch) return Promise.resolve(false);
      var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var timer = controller ? setTimeout(function () { controller.abort(); }, PROBE_TIMEOUT) : null;
      return fetch(url, controller ? { signal: controller.signal } : {})
        .then(function (r) {
          if (timer) clearTimeout(timer);
          return r.ok;
        })
        .catch(function () {
          if (timer) clearTimeout(timer);
          return false;
        });
    }

    function activateBasemap(id) {
      if (!pickerViewModel) return false;
      var models = pickerViewModel.imageryProviderViewModels;
      for (var i = 0; i < models.length; i++) {

          pickerViewModel.selectedImagery = models[i];
          return true;

      return false;

    function initBasemapAvailability() {
      var jobs = [];
      BASEMAPS.forEach(function (src) {
        if (src.manualOnly) return;
        if (src.needKey && src.needKey()) {
          probeState[src.id] = 'skip';
          return;
        }
        jobs.push(src.probe().then(function (ok) {
          probeState[src.id] = ok ? 'ok' : 'fail';
          console.log('[2RTK] 底图探测 ' + src.id + ' -> ' + (ok ? '可用' : '不可达'));
        }, function () {
          probeState[src.id] = 'fail';
        }));
      });

      Promise.all(jobs).then(function () {
        // 按 priority 选最优可用源（数组顺序只决定界面展示顺序与首屏兜底）
        var best = null;
        BASEMAPS.forEach(function (src) {
          if (src.manualOnly) return;
          if (probeState[src.id] !== 'ok') return;
          if (!best || src.priority < best.priority) best = src;
        });

        if (!best) {
          console.warn('[2RTK] 所有底图源均不可达，仅显示站点与卫星（坐标仍然准确）');
          return;
        }

        var cur = currentBasemapId();
        if (cur === best.id) return;

        var curSrc = null;
        BASEMAPS.forEach(function (src) { if (src.id === cur) curSrc = src; });

        if (!curSrc || curSrc.priority > best.priority) {
          activateBasemap(best.id);
          console.log('[2RTK] 已自动切换到最合适的底图: ' + best.id);
        }
      });
    }

      'China': {
        color: Cesium.Color.RED,
        match: function (name) { return /(BEIDOU|IGSO-\d+|M\d+[A-Z]*$|G\d+[A-Z]*$|IGSO-\d+S?|COMPASS)/i.test(name); }
      },
      'Russia': {
        color: Cesium.Color.SKYBLUE,
        match: function (name) { return /(COSMOS(?:[-\s]\d+)|LUCH(?:[-\s]\d+)?|GLONASS|PARUS)/i.test(name); }
      },
      'India': {
        color: Cesium.Color.ORANGE,
        match: function (name) { return /(IRNSS-\d+|NVS-\d+|GSAT-\d+)/i.test(name); }
      },
      'Japan': {
        color: Cesium.Color.WHITE,
        match: function (name) { return /(QZS-\d+|MICHIBIKI)/i.test(name); }
      },
      'EU': {
        color: Cesium.Color.YELLOW,
        match: function (name) { return /(GALILEO|SES-\d+|ASTRA|EUTELSAT)/i.test(name); }
      },
      'USA': {
        // 深蓝在黑色星空背景上几乎看不见，标签统一用亮一点的天蓝
        color: Cesium.Color.fromCssColorString('#6fa8ff'),
        match: function (name) { return /(GPS|NAVSTAR|BIIR-\d+|BIIRM-\d+|BIIF-\d+|BIII-\d+)/i.test(name); }
      },
      'UK': {
        color: Cesium.Color.MAGENTA,
        match: function (name) { return /(INMARSAT|GALAXY)/i.test(name); }
      }
    };

    var satelliteIcons = {
      'China': './images/cn.png',
      'Russia': './images/ru.png',
      'India': './images/in.png',
      'Japan': './images/jp.png',
      'EU': './images/eu.png',
      'USA': './images/us.png',
      'UK': './images/uk.png',
      'Other': './images/2rtk.png'
    };

    /* ==========================================================
     * 7. 通用工具
     * ========================================================== */
    function isValidCoordinate(lon, lat, height) {
      if (typeof lon !== 'number' || typeof lat !== 'number' || isNaN(lon) || isNaN(lat)) return false;
      if (lon < -180 || lon > 180) return false;
      if (lat < -90 || lat > 90) return false;
      if (height !== undefined && height !== null) {
        if (typeof height !== 'number' || isNaN(height)) return false;
        if (height < -12000 || height > 42000000) return false;
      }
      return true;
    }

    function setActiveButton(activeId) {
      document.querySelectorAll('.data-source-buttons button').forEach(function (btn) {
        btn.classList.toggle('active', btn.id === activeId);
      });
    }

    function getSatelliteCountry(name) {
      var keys = Object.keys(countrySatellites);
      for (var i = 0; i < keys.length; i++) {
        var data = countrySatellites[keys[i]];
        if (data.match && data.match(name)) return keys[i];
      }
      return 'Other';
    }

    /* ==========================================================
     * 8. 控制按钮

    /* ==========================================================
     * 9. GNSS 卫星
     *
     *    TLE 优先读本地 data/tle-gnss.txt（由 scripts/fetch_tle.py
     *    随采集任务一起刷新，跟仓库一起部署）。
     *    原因：celestrak.org 对同一 IP 有下载频率限制，超限直接返回 403，
     *    访客一旦被限流，卫星图层一颗都画不出来。
     *    本地文件缺失时才回退到 CelesTrak 实时接口。
     * ========================================================== */
    var TLE_LOCAL = './data/tle-gnss.txt';
    var TLE_REMOTE = 'https://celestrak.org/NORAD/elements/gp.php?GROUP=gnss&FORMAT=tle';

    function parseTLE(tleText) {
      // 去掉 # 注释行与空行，按 3 行一组（名称 / 1 行 / 2 行）解析
      var lines = tleText.split('\n')
        .map(function (l) { return l.replace(/\r$/, '').trim(); })
        .filter(function (l) { return l && l.charAt(0) !== '#'; });

      var added = 0;

      for (var i = 0; i + 2 < lines.length; i += 3) {
        var name = lines[i];
        var tle1 = lines[i + 1];
        var tle2 = lines[i + 2];
        if (tle1.charAt(0) !== '1' || tle2.charAt(0) !== '2') continue;

        try {
          var satrec = satellite.twoline2satrec(tle1, tle2);
          var jsDate = new Date();
          var posVel = satellite.propagate(satrec, jsDate);
          var gmst = satellite.gstime(jsDate);

          if (!posVel.position) continue;

          var geo = satellite.eciToGeodetic(posVel.position, gmst);
          var lon = Cesium.Math.toDegrees(geo.longitude);
          var lat = Cesium.Math.toDegrees(geo.latitude);
          var alt = geo.height * 1000;

          if (!isValidCoordinate(lon, lat, alt)) continue;

          var country = getSatelliteCountry(name);
          var icon = satelliteIcons[country] || satelliteIcons['Other'];
          var color = (countrySatellites[country] && countrySatellites[country].color) || Cesium.Color.GRAY;

          var entity = viewer.entities.add({
            id: 'sat_' + name,
            name: name,
            show: satellitesVisible,
            position: Cesium.Cartesian3.fromDegrees(lon, lat, alt),
            billboard: {
              image: icon,
              width: 28,
              height: 28,
              verticalOrigin: Cesium.VerticalOrigin.CENTER,
              scaleByDistance: new Cesium.NearFarScalar(500000, 1.2, 40000000, 0.35)
            },
            label: {
              text: name,
              font: '12px sans-serif',
              fillColor: color,
              style: Cesium.LabelStyle.FILL_AND_OUTLINE,
              outlineWidth: 2,
              verticalOrigin: Cesium.VerticalOrigin.TOP,
              pixelOffset: new Cesium.Cartesian2(0, 20),
              show: satelliteLabelsVisible
            },
            properties: {
              norad: satrec.satnum,
              tleDate: tleTimestamp.toISOString(),
              country: country
            }
          });
          entity.isSatellite = true;
          entity.satrec = satrec;
          entity._satInfo = {
            norad: satrec.satnum,
            tleDate: tleTimestamp.toISOString(),
            country: country
          };
          added++;
        } catch (e) {
          console.warn('[2RTK] 卫星 ' + name + ' 处理失败:', e && e.message);
        }
      }

      console.log('[2RTK] 卫星加载完成 ' + added + ' 颗');
      return added;
    }

    function loadSatellites() {
      return fetch(TLE_LOCAL, { cache: 'no-cache' })
        .then(function (res) {
          if (!res.ok) throw new Error('local TLE HTTP ' + res.status);
          return res.text();
        })
        .then(function (text) {
          if (text.indexOf('1 ') === -1) throw new Error('local TLE 内容为空');
          return parseTLE(text);
        })
        .then(function (n) {
          if (n > 0) return n;
          throw new Error('local TLE 解析出 0 颗卫星');
        })
        .catch(function (err) {
          console.warn('[2RTK] 本地 TLE 不可用（' + (err && err.message) + '），回退 CelesTrak');
          return fetch(TLE_REMOTE)
            .then(function (res) {
              if (!res.ok) throw new Error('celestrak HTTP ' + res.status);
              return res.text();
            })
            .then(parseTLE)
            .catch(function (e2) {
              console.warn('[2RTK] 卫星 TLE 全部获取失败:', e2 && e2.message);
              return 0;
            });
        });
    }

    /* ==========================================================
     * 10. 基准站点
     * ========================================================== */
    function removeAllStations() {
      var toRemove = viewer.entities.values.filter(function (e) { return e.stationType; });
      toRemove.forEach(function (e) { viewer.entities.remove(e); });
    }

    function buildStationDescription(station, stationType) {
      var rows = [];
      function row(label, value) {
        rows.push('<tr><td><b>' + label + '</b></td><td>' + (value === undefined || value === null || value === '' ? 'N/A' : value) + '</td></tr>');
      }

      if (['isRtk', 'isRtk2go', 'isCrtk', 'isCustom', 'isWorld'].indexOf(stationType) !== -1) {
        var rtcm = Array.isArray(station.rtcm_types)
          ? (station.rtcm_types.filter(Boolean).join(', ') || 'N/A')
          : 'N/A';
        row(t('tableName'), station.name);
        row(t('tableFormat'), station.format);
        row(t('tableRtcm'), rtcm);
        row(t('tableSystems'), station.systems);
        row(t('tableCountry'), station.country);
        row(t('tableLat'), station.latitude);
        row(t('tableLon'), station.longitude);
        row(t('tableHeight'), station.height);
        row(t('tableNetwork'), station.network);
        row(t('tableNtripVer'), station.ntrip_version);
        row(t('tableHost'), station.server_host);
        row(t('tablePort'), station.server_port);
        row(t('tableAddress'), station.registration_address);
      } else if (stationType === 'isIgs') {
        row(t('tableId'), station.id || station.name);
        row(t('tableName'), station.name);
        row(t('tableReceiver'), station.receiver);
        row(t('tableAntenna'), station.antenna);
        row(t('tableLat'), station.latitude);
        row(t('tableLon'), station.longitude);
        row(t('tableHeight'), station.height);
        row(t('tableSystems'), station.systems);
        row(t('tableCountry'), station.country);
        row(t('tableInstallDate'), station.receiverInstallDate);
      }

      return '<table>' + rows.join('') + '</table>';
    }

    /**
     * Cesium 的 InfoBox 只在「选中项发生变化」时重绘，
     * 直接改 entity.description 不会刷新已经打开的面板。
     * 所以切换语言后要把所有站点的描述重建一遍，
     * 再把当前选中的实体重新选一次，强制面板重绘。
     */
    function refreshStationDescriptions() {
      var selected = viewer.selectedEntity;

      viewer.entities.values.forEach(function (entity) {
        if (entity._station) {
          entity.description = buildStationDescription(entity._station, entity._stationType);
        } else if (entity.isSatellite && entity._satInfo) {
          entity.description = buildSatelliteDescription(entity);
        }
      });

      if (selected && (selected._station || selected.isSatellite)) {
        viewer.selectedEntity = undefined;
        viewer.selectedEntity = selected;
      }
    }

    function buildSatelliteDescription(entity) {
      var info = entity._satInfo || {};
      var now = new Date();
      var posVel = satellite.propagate(entity.satrec, now);
      if (!posVel || !posVel.position) return '<table></table>';

      var gmst = satellite.gstime(now);
      var geo = satellite.eciToGeodetic(posVel.position, gmst);
      var ageDays = info.tleDate
        ? ((now - new Date(info.tleDate)) / 86400000).toFixed(1)
        : 'N/A';

      function row(label, value) {
        return '<tr><td><b>' + label + '</b></td><td>' + value + '</td></tr>';
      }

      return '<table>'
        + row(t('satName'), entity.name)
        + row(t('satNorad'), info.norad)
        + row(t('tableCountry'), info.country)
        + row(t('satAlt'), geo.height.toFixed(1) + ' km')
        + row(t('satPlane'), Cesium.Math.toDegrees(entity.satrec.nodeo).toFixed(2) + '°')
        + row(t('satIncl'), Cesium.Math.toDegrees(entity.satrec.inclo).toFixed(2) + '°')
        + row(t('satTleAge'), ageDays + ' ' + t('days'))
        + '</table>';
    }

    function addRtkEntities(baseStations, color, stationType) {
      var points = [];

      baseStations.forEach(function (station) {
        if (!station.name || station.longitude === undefined || station.latitude === undefined) return;

        var lon = parseFloat(station.longitude);
        var lat = parseFloat(station.latitude);
        var height = station.height !== undefined ? parseFloat(station.height) : 0;
        if (isNaN(height)) height = 0;

        if (!isValidCoordinate(lon, lat, height)) return;

        var description = buildStationDescription(station, stationType);
        var stationId = stationType + '_' + station.name;
        var isIgs = stationType === 'isIgs';

        // IGS 是大地测量网（坐标权威、带接收机/天线信息），
        // 点画大一点以便在整球视角也能看见，且不画覆盖圈
        var marker = viewer.entities.add({
          id: stationId,
          name: station.name,     // InfoBox 标题用 name，不设的话会显示 id 前缀 isIgs_xxx
          position: Cesium.Cartesian3.fromDegrees(lon, lat, height),
          point: { pixelSize: isIgs ? 8 : 5, color: color },
          label: {
            text: station.name,
            font: '10px sans-serif',
            fillColor: color,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            outlineWidth: 2,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -12),
            show: stationLabelsVisible
          },
          description: description,
          stationType: stationType
        });

        // 记住原始数据，语言切换时可以重建描述文本
        marker._station = station;
        marker._stationType = stationType;
        if (isIgs) marker._isIgs = true;
        points.push([lon, lat]);

        if (isIgs) return;

        // 覆盖范围：单圈半径 10 公里的圆
        var ring = viewer.entities.add({
          id: stationId + '_coverage',
          name: station.name,
          position: Cesium.Cartesian3.fromDegrees(lon, lat),
          ellipse: {
            semiMinorAxis: COVERAGE_RADIUS,
            semiMajorAxis: COVERAGE_RADIUS,
            height: 0,
            material: color.withAlpha(0.06),
            outline: true,
            outlineColor: color.withAlpha(0.8)
          },
          description: description,
          stationType: stationType,
          parentId: stationId,
          show: coverageVisible
        });
        ring._station = station;
        ring._stationType = stationType;
      });

      fitToStations(points);
    }

    /**
     * 按站点分布取景：
     * 1. 先找最密集的 20°×20° 网格，作为“主区域”（避免法国海外省这类离群点把视野拉到全球）
     * 2. 主区域占多数时贴合主区域外接矩形
     * 3. 数据本身就是全球分布时退回整颗地球视角
     */
    function fitToStations(points) {
      if (!points.length) return;

      var cells = {};
      var bestKey = null;
      var bestCount = 0;

      points.forEach(function (p) {
        var key = Math.floor(p[0] / 20) + ',' + Math.floor(p[1] / 20);
        cells[key] = (cells[key] || 0) + 1;
        if (cells[key] > bestCount) {
          bestCount = cells[key];
          bestKey = key;
        }
      });

      var isGlobal = bestCount / points.length < 0.45;
      var scope = points;

      if (!isGlobal) {
        var parts = bestKey.split(',');
        var centerLon = parseFloat(parts[0]) * 20 + 10;
        var centerLat = parseFloat(parts[1]) * 20 + 10;
        var dense = points.filter(function (p) {
          var dLon = Math.abs(p[0] - centerLon);
          if (dLon > 180) dLon = 360 - dLon;
          return dLon <= 20 && Math.abs(p[1] - centerLat) <= 15;
        });
        if (dense.length) scope = dense;
      }

      var minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
      scope.forEach(function (p) {
        if (p[0] < minLon) minLon = p[0];
        if (p[0] > maxLon) maxLon = p[0];
        if (p[1] < minLat) minLat = p[1];
        if (p[1] > maxLat) maxLat = p[1];
      });

      var lonSpan = maxLon - minLon;
      var latSpan = maxLat - minLat;

      if (isGlobal || lonSpan > 120 || latSpan > 80) {
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(10, 18, 22000000),
          duration: 1.6
        });
        return;
      }

      var padLon = Math.max(lonSpan * 0.25, 0.8);
      var padLat = Math.max(latSpan * 0.25, 0.8);

      // 贴合到区域后停掉自转，否则镜头会自己转走
      if (rotationEnabled) {
        rotationEnabled = false;
        refreshControlLabels();
      }

      viewer.camera.flyTo({
        destination: Cesium.Rectangle.fromDegrees(
          Math.max(-179.9, minLon - padLon),
          Math.max(-84, minLat - padLat),
          Math.min(179.9, maxLon + padLon),
          Math.min(84, maxLat + padLat)
        ),
        duration: 1.6
      });
    }

    /* ==========================================================
     * 11. 点击拾取
     * ========================================================== */
    var handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    handler.setInputAction(function (movement) {
      var picked = viewer.scene.pick(movement.position);
      if (!Cesium.defined(picked) || !picked.id) return;

      if (picked.id.isSatellite) {
        var entity = picked.id;
        entity.description = buildSatelliteDescription(entity);
        viewer.selectedEntity = entity;
      } else if (picked.id.stationType) {
        viewer.selectedEntity = picked.id;
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    /* ==========================================================
     * 12. 数据源按钮
     * ========================================================== */
    function showInfoError(title, hint) {
      var el = document.getElementById('updateInfo');
      if (!el) return;
      el.innerHTML = '<div class="fail">' + title + '</div>'
        + (hint ? '<div class="sub">' + hint + '</div>' : '');
      setTimeout(renderUpdateInfo, 8000);
    }

    document.getElementById('loadRtkButton').addEventListener('click', function () {
      setActiveButton('loadRtkButton');
      removeAllStations();
      fetch('./data/2rtk.json')
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);

        .then(function (data) { addRtkEntities(data, Cesium.Color.CYAN, 'isRtk'); })
        .catch(function (err) {

      fetch('./data/rtk2go.json')

        .then(function (data) { addRtkEntities(data, Cesium.Color.ORANGE, 'isRtk2go'); })
        .catch(function (err) { console.warn('[2RTK] RTK2 数据加载失败:', err && err.message); });
    });

    document.getElementById('loadCrtkButton').addEventListener('click', function () {
      setActiveButton('loadCrtkButton');
      removeAllStations();
      fetch('./data/France.json')
        .then(function (res) { return res.json(); })
        .then(function (data) { addRtkEntities(data, Cesium.Color.MAGENTA, 'isCrtk'); })
        .catch(function (err) { console.warn('[2RTK] CRTK 数据加载失败:', err && err.message); });
    });

    /**
     * IGS 数据是 IGS 站日志（station log）导出的字典结构，
     * 键是 4 字符站点编号（如 ABMF00GLP），字段是 PascalCase，
     * 这里统一转成和 NTRIP 站点一致的扁平结构再画。
     */
    function normalizeIgsStations(raw) {
      var list = [];

      Object.keys(raw || {}).forEach(function (id) {
        var d = raw[id];
        if (!d) return;

        var lat = parseFloat(d.Latitude);
        var lon = parseFloat(d.Longitude);
        var height = parseFloat(d.Height);
        if (isNaN(height)) height = 0;

        var ant = d.Antenna || {};
        var rcv = d.Receiver || {};

        list.push({
          id: id,
          name: id,
          latitude: lat,
          longitude: lon,
          height: height,
          country: d.CountryOrRegion,
          systems: rcv.SatelliteSystem,
          receiver: [rcv.Name, rcv.FirmwareVersion ? 'fw ' + rcv.FirmwareVersion : '']
            .filter(Boolean).join(' · '),
          antenna: [ant.Name, ant.Radome && ant.Radome !== 'NONE' ? ant.Radome : '']
            .filter(Boolean).join(' · '),
          receiverInstallDate: rcv.DateInstalled ? String(rcv.DateInstalled).replace('T', ' ').replace('Z', '') : ''
        });
      });

      return list;
    }

    document.getElementById('loadIgsButton').addEventListener('click', function () {
      setActiveButton('loadIgsButton');
      removeAllStations();
      fetch('./data/IGSNetwork.json')
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (raw) {
          addRtkEntities(normalizeIgsStations(raw), Cesium.Color.LIME, 'isIgs');
        })
        .catch(function (err) { console.warn('[2RTK] IGS 数据加载失败:', err && err.message); });
    });

    /* ==========================================================
     * 14. 自动旋转
     * ========================================================== */
    viewer.clock.onTick.addEventListener(function () {
      if (rotationEnabled) {
        viewer.scene.camera.rotate(Cesium.Cartesian3.UNIT_Z, -Cesium.Math.toRadians(0.02));
      }
    });

    /* ==========================================================
     * 15. 数据更新时间
     * ========================================================== */
    function renderUpdateInfo() {
      var el = document.getElementById('updateInfo');
      if (!el) return;

      if (!lastMeta) {
        el.textContent = t('loading');
        return;
      }

      var sources = Array.isArray(lastMeta.sources) ? lastMeta.sources : [];
      var okCount = sources.filter(function (s) { return s && s.ok; }).length;
      var total = sources.length;
      var timeStr = lastMeta.last_update
        ? String(lastMeta.last_update).replace('T', ' ').slice(0, 16)
        : t('timeUnknown');

      el.innerHTML = ''
        + '<div>' + t('updatedAt') + ' ' + timeStr + '</div>'
        + '<div class="counts"><span class="ok">' + t('ok') + ' ' + okCount + '</span> / '
        + '<span class="' + (okCount < total ? 'fail' : 'ok') + '">' + t('fail') + ' ' + (total - okCount) + '</span> '
        + t('sourceCount') + '</div>';
    }

    function loadMetaInfo() {
      fetch('./data/meta.json')
        .then(function (res) {
          if (!res.ok) throw new Error('meta.json HTTP ' + res.status);
          return res.json();
        })
        .then(function (meta) {
          lastMeta = meta;
          renderUpdateInfo();
        })
        .catch(function () {
          lastMeta = null;
          var el = document.getElementById('updateInfo');
          if (el) el.innerHTML = '<div>' + t('timeUnknown') + '</div>';
        });
    }

    /* ==========================================================
     * 16. 启动
     * ========================================================== */
    refreshControlLabels();
    initBasemapAvailability();
    loadMetaInfo();
    loadSatellites();

    // 默认展示 rtk2go（数据量最大、覆盖最广）
    document.getElementById('loadRtk2goButton').click();
  })();
  </script>
</body>
</html>
