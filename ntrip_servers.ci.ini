; GitHub Actions 每 6 小时采集用的数据源配置
; 三路公开 Caster，源表均可匿名读取，无需账号密码
; （如将来 2rtk.net 关闭匿名源表，再到 GitHub Secrets 配 NTRIP_2RTK_* 覆盖，
;   见 .github/workflows/collect.yml 的 Prepare config 步骤）

[rtk2go]
host = rtk2go.com
port = 2101
enabled = true
output_prefix = rtk2go
address = https://www.rtk2go.com/
username = mail
password = none

[France]
host = crtk.net
port = 2101
enabled = true
output_prefix = France
address = https://map.centipede-rtk.org/
username = centipede
password = centipede

[2rtk]
host = 2rtk.net
port = 2101
enabled = true
output_prefix = 2rtk
address = https://2rtk.com
; 源表匿名可读，留空即走无认证请求

[auscors]
host = ntrip.data.gnss.ga.gov.au
port = 2101
enabled = true
output_prefix = auscors
address = https://www.ga.gov.au/scientific-topics/positioning-navigation/auscors
; AUSCORS（澳大利亚 Geoscience Australia 国家 CORS 网）
; 源表 2101 明文端口匿名可读；取实时改正流才需要注册账号，展示站点不需要
