; GitHub Actions 每 6 小时采集用的数据源配置
; 只保留地图上真正展示的三路公开 Caster，其余国家的源表已下线
; 自建 2rtk.net Caster 的账号密码通过 GitHub Secrets 注入，见 .github/workflows/collect.yml

[rtk2go]
host = rtk2go.com
port = 2101
enabled = true
output_prefix = rtk2go
address = https://www.rtk2go.com/
username = mail
password = none

[France]
host = crtk.net
port = 2101
enabled = true
output_prefix = France
address = https://map.centipede-rtk.org/
username = centipede
password = centipede
